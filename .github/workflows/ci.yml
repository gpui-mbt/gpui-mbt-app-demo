name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gpui-ref:
        description: gpui.mbt branch or commit to test against
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-web:
    name: Portable model/scene + web smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show toolchains and update registry
        run: |
          moon version --all
          moon update
          node --version
          "$CHROME_BIN" --version
      - name: Check and test portable packages
        run: |
          moon check --target js --deny-warn src/model src/scene src/web
          moon test --target js --deny-warn src/model src/scene
          moon fmt --check src/model src/scene src/app src/web
      - name: Build web demo
        run: ./scripts/build_web.sh
      - name: Run web smoke
        run: node scripts/smoke_web.mjs
      - name: Upload web demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-demo
          path: web
          if-no-files-found: error
      - name: Upload web screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke
          path: build/web-smoke
          if-no-files-found: warn

  macos-app:
    name: macOS app build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out gpui.mbt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ github.event.inputs.gpui-ref || 'main' }}
          path: .gpui
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Show toolchain and update registry
        run: |
          moon version --all
          moon update
      - name: Test portable packages
        run: moon test --target native --deny-warn src/model src/scene
      - name: Build app bundle
        run: GPUI_ROOT="$GITHUB_WORKSPACE/.gpui" ./build.sh --build
      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GpuiMacDemo
          path: build/GpuiMacDemo.app
          if-no-files-found: error

  gpui-main:
    name: gpui.mbt main lane
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out gpui.mbt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ github.event.inputs.gpui-ref || 'main' }}
          path: .gpui
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Update registry
        run: moon update
      - name: Use gpui.mbt main as a workspace member
        run: ./scripts/use-local-gpui.sh .gpui
      - name: Check portable packages against gpui.mbt main
        run: |
          moon check --target js --deny-warn src/model src/scene src/web
          moon test --target js --deny-warn src/model src/scene

  windows-app:
    name: Windows app build and smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out gpui.mbt Windows runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gpui-mbt/gpui.mbt
          ref: ${{ github.event.inputs.gpui-ref || 'feat/20261018-windows-app-runtime' }}
          path: .gpui
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Update registry
        shell: pwsh
        run: moon update
      - name: Prepare the Windows workspace
        shell: pwsh
        run: |
          $relative = [System.IO.Path]::GetRelativePath((Resolve-Path windows-app).Path, (Resolve-Path .gpui).Path).Replace('\', '/')
          @('members = [', '  ".",', '  "..",', "  `"$relative`",", ']') | Set-Content -Path windows-app/moon.work -Encoding ascii
      - name: Check and test shared packages
        shell: pwsh
        run: |
          moon check --target native --deny-warn src/model src/scene src/native src/app
          moon test --target native --deny-warn src/model src/scene
          moon fmt --check src/model src/scene src/native src/app
          Push-Location windows-app
          try {
            moon check --target native --deny-warn src/windows
            moon fmt --check src/windows
          } finally {
            Pop-Location
          }
      - name: Build and smoke the Windows app
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Mode smoke -GpuiRoot .gpui
      - name: Upload Windows smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke
          path: build/windows-smoke
          if-no-files-found: warn
